name: Release — checkout-button SDK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-checkout-button
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: "release: version @maytes/checkout-button"
          commit: "release: version @maytes/checkout-button"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach release assets
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v${version}" \
            dist/checkout-button.js dist/checkout-button.js.map \
            dist/checkout-button.mjs dist/checkout-button.mjs.map \
            dist/checkout-button.cjs dist/checkout-button.cjs.map \
            dist/integrity.json \
            --repo "${{ github.repository }}" --clobber

      - name: Cache CDN release history
        if: steps.changesets.outputs.published == 'true'
        uses: actions/cache@v4
        with:
          path: .cdn-history-cache
          key: cdn-history-${{ github.run_id }}
          restore-keys: |
            cdn-history-

      - name: Rehydrate CDN release history
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rehydrate-cdn-history.mjs

      - name: Deploy bundle to CDN
        if: steps.changesets.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          node scripts/cdn-config.mjs
          node scripts/ensure-cdn-cache-rules.mjs
          npx wrangler@3 pages deploy dist --project-name=checkout-button --branch=main

  cdn-deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

      - name: Cache CDN release history
        uses: actions/cache@v4
        with:
          path: .cdn-history-cache
          key: cdn-history-${{ github.run_id }}
          restore-keys: |
            cdn-history-

      - name: Rehydrate CDN release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rehydrate-cdn-history.mjs

      - name: Deploy bundle to CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          node scripts/cdn-config.mjs
          node scripts/ensure-cdn-cache-rules.mjs
          npx wrangler@3 pages deploy dist --project-name=checkout-button --branch=main
      - name: Backfill release assets for the current version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v${version}" \
            dist/checkout-button.js dist/checkout-button.js.map \
            dist/checkout-button.mjs dist/checkout-button.mjs.map \
            dist/checkout-button.cjs dist/checkout-button.cjs.map \
            dist/integrity.json \
            --repo "${{ github.repository }}" --clobber
